<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Encrypted Mirror{% endblock %} · Gitea ⇄ GitHub</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1c2330; --muted:#6b7484; --line:#e4e7ec;
          --accent:#2563eb; --ok:#15803d; --warn:#b45309; --err:#b91c1c; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--ink); }
  header { background:#111827; color:#fff; padding:0 20px; }
  header .wrap { max-width:1080px; margin:0 auto; display:flex; align-items:center; gap:18px; height:56px; }
  header .brand { font-weight:700; font-size:15px; white-space:nowrap; }
  header .brand span { color:#93c5fd; }
  nav { display:flex; gap:4px; margin-left:8px; }
  nav a { color:#cbd5e1; text-decoration:none; padding:8px 12px; border-radius:8px; font-size:14px; }
  nav a:hover { background:#1f2937; color:#fff; }
  nav a.active { background:#1f2937; color:#fff; }
  header .spacer { flex:1; }
  header form { margin:0; }
  header button { background:transparent; border:1px solid #374151; color:#cbd5e1; border-radius:8px;
                  padding:6px 12px; cursor:pointer; font-size:13px; }
  header button:hover { background:#1f2937; }
  main { max-width:1080px; margin:24px auto; padding:0 20px 60px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-bottom:22px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; }
  .card .k { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px; }
  .card .v { font-size:26px; font-weight:700; }
  .card .s { font-size:13px; color:var(--muted); margin-top:4px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:18px; }
  .panel h2 { margin:0 0 12px; font-size:16px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  tr:last-child td { border-bottom:none; }
  .pill { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:600; }
  .pill.ok { background:#dcfce7; color:var(--ok); }
  .pill.skip { background:#fef3c7; color:var(--warn); }
  .pill.err { background:#fee2e2; color:var(--err); }
  .pill.info { background:#dbeafe; color:var(--accent); }
  .pill.mut { background:#eef0f3; color:var(--muted); }
  .btn { display:inline-block; border:1px solid var(--line); background:#fff; border-radius:8px;
         padding:7px 14px; font-size:13px; cursor:pointer; color:var(--ink); text-decoration:none; }
  .btn:hover { background:#f1f3f6; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.primary:hover { background:#1d4ed8; }
  .btn.danger { color:var(--err); }
  .btn:disabled { opacity:.5; cursor:default; }
  form.inline { display:inline; margin:0; }
  .flash { padding:12px 16px; border-radius:10px; margin-bottom:16px; font-size:14px; }
  .flash.ok { background:#dcfce7; color:#14532d; }
  .flash.error { background:#fee2e2; color:#7f1d1d; }
  .field { margin-bottom:14px; }
  .field label { display:block; font-size:13px; font-weight:600; margin-bottom:6px; }
  .field input[type=text], .field input[type=password], .field select {
    width:100%; max-width:520px; padding:9px 12px; border:1px solid var(--line); border-radius:8px; font-size:14px; }
  .field .hint { font-size:12px; color:var(--muted); margin-top:4px; }
  .field .src { font-size:11px; font-weight:600; margin-left:8px; }
  .src.environment { color:var(--accent); } .src.ui { color:var(--ok); } .src.unset { color:var(--muted); }
  input[readonly] { background:#f1f3f6; color:var(--muted); }
  .check { display:flex; align-items:center; gap:8px; font-size:14px; }
  .muted { color:var(--muted); font-size:13px; }
  .row-actions { display:flex; gap:6px; flex-wrap:wrap; }
  .keyform { display:flex; gap:6px; }
  .keyform input { width:170px; padding:6px 10px; border:1px solid var(--line); border-radius:8px; font-size:13px; }
  h1 { font-size:22px; margin:0 0 18px; }
  .toolbar { display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; align-items:center; }
  code { background:#eef0f3; padding:2px 6px; border-radius:6px; font-size:13px; }
  @media (max-width:640px){ .keyform input{ width:120px; } th:nth-child(4), td:nth-child(4){ display:none; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">🔐 Encrypted <span>Mirror</span></div>
    {% if session.get("authed") %}
    <nav>
      <a href="{{ url_for('dashboard') }}" class="{% if request.path=='/' %}active{% endif %}">Dashboard</a>
      <a href="{{ url_for('repos') }}" class="{% if request.path.startswith('/repos') %}active{% endif %}">Repositories</a>
      <a href="{{ url_for('destinations') }}" class="{% if request.path.startswith('/destinations') %}active{% endif %}">Destinations</a>
      <a href="{{ url_for('runs') }}" class="{% if request.path.startswith('/runs') %}active{% endif %}">History</a>
      <a href="{{ url_for('config') }}" class="{% if request.path.startswith('/config') %}active{% endif %}">Config</a>
    </nav>
    <div class="spacer"></div>
    <form class="inline" method="post" action="{{ url_for('logout') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit">Log out</button>
    </form>
    {% endif %}
  </div>
</header>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="flash {{ cat }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
